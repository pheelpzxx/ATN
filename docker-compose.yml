services:
  postgres:
    image: postgres:16-alpine
    container_name: loja-veloz-postgres
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [loja_veloz_net]
    ports:
      - "5432:5432"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: loja-veloz-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [loja_veloz_net]

  api-gateway:
    build: ./api-gateway
    image: ghcr.io/usuario/api-gateway:1.0.0
    environment:
      SERVICE_NAME: api-gateway
      APP_VERSION: 1.0.0
      PEDIDOS_URL: http://pedidos-service:5000/orders
      PAGAMENTOS_URL: http://pagamentos-service:5000/payments
      ESTOQUE_URL: http://estoque-service:5000/stock/reserve
    ports:
      - "8080:5000"
    depends_on: [pedidos-service, pagamentos-service, estoque-service]
    networks: [loja_veloz_net]

  pedidos-service:
    build: ./pedidos-service
    image: ghcr.io/usuario/pedidos-service:1.0.0
    environment:
      SERVICE_NAME: pedidos-service
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql://pedidos:pedidos_dev@postgres:5432/pedidos
    depends_on: [postgres]
    networks: [loja_veloz_net]

  pagamentos-service:
    build: ./pagamentos-service
    image: ghcr.io/usuario/pagamentos-service:1.0.0
    environment:
      SERVICE_NAME: pagamentos-service
      APP_VERSION: 1.0.0
      PAYMENT_PROVIDER_URL: https://sandbox.pagamentos.local
    networks: [loja_veloz_net]

  estoque-service:
    build: ./estoque-service
    image: ghcr.io/usuario/estoque-service:1.0.0
    environment:
      SERVICE_NAME: estoque-service
      APP_VERSION: 1.0.0
    networks: [loja_veloz_net]

volumes:
  postgres_data:

networks:
  loja_veloz_net:
    driver: bridge
